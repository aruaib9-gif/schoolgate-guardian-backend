# ---------------------------------------------------------------------------
# Render Blueprint for SchoolGate Guardian API
#
# One-click infrastructure: a managed PostgreSQL database + the Dockerized API.
# On Render: New → Blueprint → connect this repo. Render reads this file and
# provisions everything below. Migrations run automatically on start
# (start:prod → prisma migrate deploy).
#
# After the first deploy, seed starter data once from the service's Shell tab:
#   npm run seed
#
# Values marked `sync: false` are secrets you type into the Render dashboard.
#
# ⚠️  PRODUCTION: both plans below are `free` for evaluation. Free Render
# databases ARE DELETED after ~90 days (with their data), and free web
# services sleep between requests. Change both to `starter` or higher before
# real schools depend on this. Uploaded files need the R2_* block below set in
# the dashboard — the container filesystem is wiped on every deploy, so without
# it every staff and pupil photo is lost each time the service redeploys.
# ---------------------------------------------------------------------------
databases:
  - name: schoolgate-db
    databaseName: schoolgate
    user: schoolgate
    plan: free # ⚠️ free DBs expire after ~90 days — use `starter`+ in production

services:
  - type: web
    name: schoolgate-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # change to `starter`+ for always-on production
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Wired automatically from the database created above.
      - key: DATABASE_URL
        fromDatabase:
          name: schoolgate-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # A strong random secret, generated once by Render and kept stable.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MAX_UPLOAD_MB
        value: 10
      # Public URL of THIS service. Render exposes its own host at runtime;
      # set this to your final URL (e.g. https://schoolgate-api.onrender.com)
      # after the first deploy so returned file links are correct.
      - key: PUBLIC_URL
        sync: false
      # Comma-separated frontend origin(s) allowed to call the API.
      - key: CORS_ORIGIN
        sync: false
      # First-run admin login (used by `npm run seed`). Set real values.
      - key: SEED_SUPERADMIN_EMAIL
        sync: false
      - key: SEED_SUPERADMIN_PASSWORD
        sync: false
      - key: SEED_SCHOOL_ADMIN_PASSWORD
        sync: false
      # Shared secret for scheduler/cron calls to /functions/*.
      - key: CRON_SECRET
        generateValue: true
      # Email. Optional — if nothing below is set, emails are logged instead of
      # sent. Resend is preferred; the SMTP block is the fallback transport.
      # See EMAIL_SETUP.md.
      # Leave unset to auto-detect (Resend if a key is present, else SMTP,
      # else console). Set to resend|smtp|console to force one.
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Where emailed invite / reset links point — the WEB APP, not this API.
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Object storage for uploaded photos (Cloudflare R2). All five must be
      # set together or the service refuses to start — see RENDER_R2.md.
      # Without them, photos go to the container filesystem and are lost on
      # every deploy.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE
        sync: false
