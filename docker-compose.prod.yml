# ---------------------------------------------------------------------------
# Production stack: the API + its own PostgreSQL, on one host.
#
#   1. Put real secrets in a .env next to this file (JWT_SECRET, CRON_SECRET,
#      POSTGRES_PASSWORD, CORS_ORIGIN, PUBLIC_URL, SEED_SUPERADMIN_*).
#   2. docker compose -f docker-compose.prod.yml up -d --build
#   3. One-time seed (roles + superadmin + demo schools):
#        docker compose -f docker-compose.prod.yml exec api npm run seed
#
# Migrations are applied automatically on start (start:prod → prisma migrate deploy).
# If you use a MANAGED database instead, delete the `db` service and point
# DATABASE_URL at your provider's connection string.
# ---------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-schoolgate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-schoolgate}']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-schoolgate}?schema=public
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      CRON_SECRET: ${CRON_SECRET:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-superadmin@schoolgate.example}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-ChangeMe123!}
      SEED_SCHOOL_ADMIN_PASSWORD: ${SEED_SCHOOL_ADMIN_PASSWORD:-password123}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-SchoolGate Guardian <no-reply@schoolgate.example>}
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
