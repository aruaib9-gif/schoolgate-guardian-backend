name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      # Syntax-check every source file, then run the invariant test suite.
      - run: for f in $(find src -name '*.js'); do node --check "$f" || exit 1; done
      - run: npm test
